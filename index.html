<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 41 Practice Quiz 2</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        [data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }[data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }[data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }

        [data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }[data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
            #reveal-all-container { justify-content: flex-start !important; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 41 Practice Quiz 2</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData =[
            // --- Section 1: Nephritic Syndrome ---
            {
                section: "Nephritic Syndrome",
                fullLO: "LO1: Define nephritic syndrome.",
                question: "A 25-year-old man presents to the clinic with sudden onset of dark, tea-colored urine and mild swelling around his eyes. His blood pressure is 150/95 mm Hg. A 24-hour urine collection reveals 1.5 g of protein. Which of the following underlying processes best defines the broad category of this patient's glomerular disease?",
                options: {
                    A: "Autoimmune destruction of the renal tubules",
                    B: "Deposition of amyloid fibrils in the mesangium",
                    C: "Inflammatory process of the glomerulus",
                    D: "Ischemic necrosis of the renal papillae",
                    E: "Noninflammatory podocyte effacement"
                },
                correctAnswer: "C",
                rationale: "Nephritic syndrome (glomerulonephritis) is fundamentally defined as an inflammatory process, in contrast to nephrotic syndrome, which is a noninflammatory process. It is characterized by active urine sediment and sub-nephrotic proteinuria.",
                source: "Nephritic Syndrome PDF, slide 45: '1) Nephritic Syndrome (Glomerulonephritis) • Inflammatory process'"
            },
            {
                section: "Nephritic Syndrome",
                fullLO: "LO1: Define nephritic syndrome.",
                question: "A 35-year-old woman is being evaluated for new-onset hypertension and hematuria. Her urinalysis shows dysmorphic red blood cells. To definitively classify her presentation as a nephritic syndrome rather than a nephrotic syndrome, her 24-hour urinary protein excretion should typically fall below which of the following thresholds?",
                options: {
                    A: "1.0 g/day",
                    B: "2.0 g/day",
                    C: "3.5 g/day",
                    D: "5.0 g/day",
                    E: "10.0 g/day"
                },
                correctAnswer: "C",
                rationale: "Nephritic syndrome is characterized by variable, sub-nephrotic proteinuria, which is typically < 3.5 g/day . Nephrotic syndrome is defined by heavy proteinuria > 3.5 g/day .",
                source: "Nephritic Syndrome PDF, slide 45: 'Nephritic Syndrome • Proteinuria < 3.5 g/day – variable'"
            },
            {
                section: "Nephritic Syndrome",
                fullLO: "LO2: Describe the clinical presentation of nephritic syndrome.",
                question: "A 40-year-old man presents to the emergency department with a 3-day history of grossly bloody urine and decreased urine output. His blood pressure is markedly elevated. Urinalysis reveals numerous red blood cells. Which of the following formed elements in the urine sediment is most classically associated with this patient's clinical presentation?",
                options: {
                    A: "Calcium oxalate crystals",
                    B: "Fatty casts",
                    C: "Hyaline casts",
                    D: "RBC casts",
                    E: "White blood cell casts"
                },
                correctAnswer: "D",
                rationale: "The clinical presentation of acute nephritic syndrome includes the acute onset of hematuria, mild/moderate proteinuria, hypertension, decreased GFR, and an active urine sediment that classically features RBCs and RBC casts.",
                source: "Nephritic Syndrome PDF, slides 44 & 45: 'Acute Nephritic Syndrome • Acute onset of hematuria, mild/moderate proteinuria, hypertension, and decreased GFR.' and 'Active urine sediment: RBCs +/- WBCs +/- RBC Casts'"
            },
            {
                section: "Nephritic Syndrome",
                fullLO: "LO2: Describe the clinical presentation of nephritic syndrome.",
                question: "A 65-year-old woman presents with severe fatigue and progressive swelling over the past two weeks. Her serum creatinine has rapidly increased from 1.0 mg/dL to 4.5 mg/dL during this short period. Urinalysis shows hematuria and proteinuria. A renal biopsy is performed. Which of the following is the most likely pathological finding explaining this specific, rapid clinical progression?",
                options: {
                    A: "Diffuse thickening of the glomerular basement membrane",
                    B: "Extensive crescent formation inside Bowman's capsule",
                    C: "Kimmelstiel-Wilson nodules",
                    D: "Massive deposition of amyloid",
                    E: "Uniform effacement of podocyte foot processes"
                },
                correctAnswer: "B",
                rationale: "Rapidly Progressive Glomerulonephritis (RPGN) presents with a progressive loss of GFR over a short period (days, weeks, or months). This clinical presentation is typically accompanied by the histological finding of extensive crescent formation inside Bowman's capsule.",
                source: "Nephritic Syndrome PDF, slide 44: 'Rapidly Progressive Glomerulonephritis • Group of nephritic syndromes with progressive loss of GFR over short period of time (days, weeks, or months). Typically with extensive crescent formation.'"
            },
            {
                section: "Nephritic Syndrome",
                fullLO: "LO3: Describe how the urinalysis, urine microscopy, and the renal biopsy is useful in the diagnosis of nephritic syndromes.",
                question: "A 28-year-old man is referred to a nephrologist for evaluation of asymptomatic hematuria. The physician emphasizes that identifying the source of the bleeding is critical. Which of the following findings on urine microscopy would most strongly suggest that the hematuria is specifically of glomerular (renal) origin?",
                options: {
                    A: "Abundant squamous epithelial cells",
                    B: "Dysmorphic RBCs",
                    C: "Numerous neutrophils",
                    D: "Oval fat bodies",
                    E: "Transitional epithelial cells"
                },
                correctAnswer: "B",
                rationale: "The presence of dysmorphic RBCs (and RBC casts) on urine microscopy strongly points to a glomerular origin for the hematuria, indicating a nephritic process rather than lower urinary tract bleeding.",
                source: "Nephritic Syndrome PDF, slide 4: 'Asymptomatic • Proteinuria < 2 g/day , Microscopic hematuria, Dysmorphic RBCs'"
            },
            {
                section: "Nephritic Syndrome",
                fullLO: "LO3: Describe how the urinalysis, urine microscopy, and the renal biopsy is useful in the diagnosis of nephritic syndromes.",
                question: "A patient with suspected microscopic polyangiitis undergoes a renal biopsy. The nephropathologist examines the tissue under light microscopy to assess how the glomerulus has reacted to the injury. Which of the following morphologic changes is a hallmark of a nephritic (glomerulonephritis) process rather than a purely nephrotic one?",
                options: {
                    A: "Amyloid fibril deposition",
                    B: "Basement membrane thickening without proliferation",
                    C: "Hyalinization of the afferent arteriole",
                    D: "Hypercellularity",
                    E: "Podocyte effacement"
                },
                correctAnswer: "D",
                rationale: "The glomerulus reacts to injury in limited ways. Hypercellularity (cellular proliferation, leukocyte infiltration, formation of crescents) is the histological hallmark of glomerulonephritis (nephritic syndrome).",
                source: "Nephritic Syndrome PDF, slide 25: 'The glomerulus reacts to injury in a limited number of ways: 1. Hypercellularity (glomerulonephritis) Cellular proliferation, Leukocyte infiltration, Formation of crescents'"
            },
            {
                section: "Nephritic Syndrome",
                fullLO: "LO4: List the common causes of the nephritic syndrome.",
                question: "A 45-year-old man presents with acute nephritic syndrome. Serologic testing reveals normal complement levels (C3 and C4) and positive testing for anti-neutrophil cytoplasmic antibodies (ANCA). Based on the complement profile, which of the following is the most likely cause of his glomerulonephritis?",
                options: {
                    A: "Cryoglobulinemia",
                    B: "IgA nephropathy",
                    C: "Lupus nephritis",
                    D: "Microscopic polyangiitis",
                    E: "Post-streptococcal glomerulonephritis"
                },
                correctAnswer: "D",
                rationale: "Microscopic polyangiitis is an ANCA-associated vasculitis. In the classification of glomerulonephritis according to complement, ANCA-associated vasculitides present with normal complement levels, distinguishing them from immune-complex mediated causes (like Lupus or cryoglobulinemia) which present with low complement.",
                source: "Nephritic Syndrome PDF, slide 49: 'Classification of GN According to Complement... Normal: Renal-limited vasculitis (ANCA+)... -Microscopic polyangiitis'"
            },
            {
                section: "Nephritic Syndrome",
                fullLO: "LO4: List the common causes of the nephritic syndrome.",
                question: "A 12-year-old boy presents with gross hematuria and sensorineural hearing loss. His family history is significant for an uncle who required a kidney transplant in his 30s. A genetic defect affecting the glomerular basement membrane is suspected. Which of the following is the most likely diagnosis?",
                options: {
                    A: "Alport syndrome",
                    B: "Fabry disease",
                    C: "Goodpasture syndrome",
                    D: "IgA nephropathy",
                    E: "Thin Basement Membrane Lesion"
                },
                correctAnswer: "A",
                rationale: "Alport syndrome is a hereditary cause of nephritic syndrome associated with genetic mutations in collagen IV affecting the basement membrane. It typically presents with hematuria and sensorineural hearing loss (and sometimes anterior lenticonus).",
                source: "Nephritic Syndrome PDF, slides 47 & 49: 'Primary Disorders... Hereditary • Thin Basement Membrane Lesion (4%) • Alport Syndrome (2%)' AND 'Alport syndrome with sensorineural hearing loss, anterior lenticonus'"
            },
            {
                section: "Nephritic Syndrome",
                fullLO: "LO5: Describe the clinical presentations and diagnosis of the common causes of the nephritic syndrome.",
                question: "A 10-year-old boy is brought to the clinic because his urine is the color of Coca-Cola. His mother reports he had a severe skin infection (impetigo) about two weeks ago. His blood pressure is 140/90 mm Hg. Laboratory studies show low C3 complement levels and elevated antistreptolysin O (ASO) antibodies. A renal biopsy, if performed, would most likely reveal which of the following on electron microscopy?",
                options: {
                    A: "Diffuse podocyte effacement",
                    B: "Large hump-shaped subepithelial deposits",
                    C: "Linear IgG deposition along the basement membrane",
                    D: "Sausage-shaped intramembranous deposits",
                    E: "Subendothelial deposits forming a tram-track appearance"
                },
                correctAnswer: "B",
                rationale: "The presentation of acute nephritic syndrome 7-10 days after a streptococcal skin infection with low C3 and positive ASO is classic for Post-streptococcal GN. On electron microscopy, this condition is characterized by large hump-shaped subepithelial deposits.",
                source: "Nephritic Syndrome PDF, slides 82 & 83: 'Acute Proliferative Infection-Related GN • Post streptococcal GN • Onset 7-10days after Group A Beta- hemolytic streptococcal infection of the skin or throat' AND 'EM: large hump-shaped subepithelial deposits'"
            },
            {
                section: "Nephritic Syndrome",
                fullLO: "LO5: Describe the clinical presentations and diagnosis of the common causes of the nephritic syndrome.",
                question: "A 24-year-old Asian male presents with an episode of gross hematuria. He states this has happened before, typically occurring simultaneously with a severe sore throat (upper respiratory infection). His complement levels are normal. A biopsy is performed and immunofluorescence shows prominent staining in the mesangium. Which of the following immunoglobulins is most likely depositing in the mesangium?",
                options: {
                    A: "IgA",
                    B: "IgD",
                    C: "IgE",
                    D: "IgG",
                    E: "IgM"
                },
                correctAnswer: "A",
                rationale: "IgA nephropathy is the most common GN worldwide, prevalent in young Asian males, and typically presents with gross hematuria concurrently with a URI (synpharyngitic). Immunofluorescence shows IgA deposits in the mesangium.",
                source: "Nephritic Syndrome PDF, slides 88 & 89: 'IgA nephropathy • Most common GN worldwide • More common in Asians and Whites... Gross hematuria commonly occurs during or immediately following a URI or intense exercise (synpharyngitic)' AND 'IF: IgA deposits in mesangium'"
            },

            // --- Section 2: Nephrotic Syndrome ---

                correctAnswer: "C",

                options: {

                options: {

                options: {

                source: "Acid-Base Disorders and Clinical Correlations PDF, slide 10: 'Osmolal Gap • ALWAYS calculate osmolal Gap for any high anion gap metabolic acidosis... Osmolal Gap > 10 suggests toxic alcohol poisoning – Methanol, Ethylene Glycol -> HAGMA'"

            {
                section: "Acid-Base Disorders and Clinical Correlations",
                fullLO: "LO6: Explain the utility of the osmolal gap, urinary anion gap, and the delta gap.",

                options: {
                    A: "Delta gap",
                    B: "Osmolal gap",
                    C: "Serum albumin level",
                    D: "Urine specific gravity",
                    E: "Urinary anion gap"
                },
                correctAnswer: "E",
                rationale: "The Urinary Anion Gap (UAG) is used specifically to evaluate the cause of a normal anion gap metabolic acidosis. A positive UAG points to Renal Tubular Acidosis (RTA), whereas a negative UAG (NeGUTive) points to gastrointestinal losses like diarrhea.",
                source: "Acid-Base Disorders and Clinical Correlations PDF, slides 21 & 14: 'Other “gaps” – UAG is used in evaluating a normal anion gap metabolic acidosis.' AND 'Urinary Anion Gap... UAG Positive in RTA UAG NeGUTive in GI'"
            }
        ];

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');
        const customBuilder = document.getElementById('custom-builder');
        const rootElements = document.documentElement;

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Regulation of Acid-Base")) btnText = "Regulation of Acid-Base";
                    if (btnText.includes("Control Micturition & Diuretics")) btnText = "Control Micturition & Diuretics";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
